[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tf-matplotlib"
version = "0.1.0"
authors = [
  { name="Yurui", email="yrming@gmail.com" }
]
description = "Connect TensorFlow tensors with Matplotlib plotting"
readme = "README.md"
license = { file="MIT" }
requires-python = ">=3.9,<3.13"
dependencies = [
  "tensorflow>=2.10",
  "matplotlib>=3.6",
  "numpy>=1.21"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "twine",
  "build",
  "ipython"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { file = "src/tf_matplotlib/_version.py" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]